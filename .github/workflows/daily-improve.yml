name: Daily improvement

on:
  schedule:
    # 30 1 * * * = 8:30 PM EST (previous day); 9:30 PM EDT during daylight saving.
    # With 0–4 hours of jitter: 8:30 PM–12:30 AM EST / 9:30 PM–1:30 AM EDT.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-improvement
  cancel-in-progress: false

jobs:
  propose:
    # Secrets are never exposed to pull_request code or a manually selected feature branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 260
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.generate.outputs.ready }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - name: Randomized daily delay (manual runs start immediately)
        if: github.event_name == 'schedule'
        run: |
          delay=$(shuf -i 0-14399 -n 1)
          echo "Daily jitter: ${delay} seconds" >> "$GITHUB_STEP_SUMMARY"
          sleep "$delay"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Avoid duplicate proposals while a previous draft needs attention
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --state open --limit 1000 --json headRefName --jq '[.[] | select(.headRefName | startswith("codex/daily-improve-"))] | length')
          if [ "$count" -eq 0 ]; then
            echo 'clear=true' >> "$GITHUB_OUTPUT"
          else
            echo 'An improvement PR is awaiting review; skipping another API call.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Propose one scoped change (never execute generated code here)
        id: generate
        if: steps.pending.outputs.clear == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1' }}
        run: |
          python3 scripts/daily_improve.py --propose
          if [ -f .daily-improve/proposal.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.generate.outputs.ready == 'true'
        with:
          name: proposal
          path: .daily-improve/proposal.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  draft:
    needs: propose
    if: needs.propose.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      number: ${{ steps.pr.outputs.pull-request-number }}
      head: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal
          path: .daily-improve
      - name: Prepare draft text only (never execute generated code)
        run: python3 scripts/daily_improve.py --prepare-draft .daily-improve/proposal.json
      - name: Open draft before running checks
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: codex/daily-improve-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'chore: propose scoped daily improvement'
          title: 'Glacier: daily improvement #${{ github.run_number }} — checks pending'
          body-path: .daily-improve/report.md
          draft: true
          add-paths: |
            Sources/*.swift
            Tests/*.swift

  verify:
    needs: [propose, draft]
    if: needs.propose.outputs.ready == 'true'
    # The owner explicitly selected portable checks as the automatic merge gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.propose.outputs.base }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: proposal
          path: .daily-improve
      - name: Check portable baseline and proposal, then record portable-only completion
        run: python3 scripts/daily_improve.py --apply-proposal .daily-improve/proposal.json --portable --complete-portable
      - name: Preserve failed check diagnostics without publishing a patch
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failed-check-log
          path: .daily-improve/checks.log
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-improvement
          path: |
            .daily-improve/verified.patch
            .daily-improve/report.md
            .daily-improve/base.txt
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  merge:
    needs: [propose, draft, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-improvement
          path: .daily-improve
      - name: Ensure nobody has changed the draft since verification started
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.draft.outputs.number }}
          EXPECTED_HEAD: ${{ needs.draft.outputs.head }}
        run: |
          test -n "$PR_NUMBER"
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$EXPECTED_HEAD"
      - name: Apply candidate data only; never execute generated code with write access
        env:
          EXPECTED_BASE: ${{ needs.propose.outputs.base }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(cat .daily-improve/base.txt)" = "$EXPECTED_BASE"
          git apply --check .daily-improve/verified.patch
          git apply .daily-improve/verified.patch
          python3 - <<'PY'
          import re, subprocess
          records = subprocess.check_output(['git', 'diff', '--raw', '--no-abbrev']).decode().splitlines()
          assert records, 'Empty patch'
          for record in records:
              metadata, path = record.split('\t')
              assert metadata.split()[0:2] == [':100644', '100644'], 'Only existing regular files allowed'
              assert metadata.split()[-1] == 'M', 'No added/deleted/renamed files allowed'
              assert re.fullmatch(r'(Sources|Tests)/[A-Za-z0-9_]+\.swift|ROADMAP\.md|CHANGELOG\.md', path), 'Unexpected path'
          PY
          git diff --check
      - name: Update the same draft with checked completion metadata
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: codex/daily-improve-${{ github.run_id }}-${{ github.run_attempt }}
          commit-message: 'chore: complete daily improvement after portable checks'
          title: 'Glacier: daily improvement #${{ github.run_number }} — portable checks passed'
          body-path: .daily-improve/report.md
          draft: true
          add-paths: |
            Sources/*.swift
            Tests/*.swift
            ROADMAP.md
            CHANGELOG.md
      - name: Mark ready and squash-merge exactly the checked head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          ORIGINAL_PR: ${{ needs.draft.outputs.number }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
          EXPECTED_BASE: ${{ needs.propose.outputs.base }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$PR_NUMBER" = "$ORIGINAL_PR"
          test -n "$EXPECTED_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" --jq .object.sha)" = "$EXPECTED_BASE"
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$EXPECTED_HEAD"
          gh pr ready "$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_HEAD"
          test "$(gh pr view "$PR_NUMBER" --json state --jq .state)" = MERGED
          echo "Automatically squash-merged PR #$PR_NUMBER after portable checks. Native Swift build/tests were not run." >> "$GITHUB_STEP_SUMMARY"
      - name: Restore draft if publishing or merging fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.draft.outputs.number }}
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$(gh pr view "$PR_NUMBER" --json state,isDraft --jq 'select(.state == "OPEN" and .isDraft == false) | .state')" = OPEN ]; then
            gh pr ready "$PR_NUMBER" --undo
          fi
