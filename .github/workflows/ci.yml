name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # GITHUB_TOKEN-created PR runs can require approval and expire on auto-merge.
  # Independently check the resulting main commit after the daily workflow ends.
  # This remains post-merge evidence, not a replacement for the portable merge gate.
  workflow_run:
    workflows: [Daily improvement]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # workflow_run github.sha is the default-branch snapshot, not the
          # pre-proposal head_sha of the completed daily run.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact native verification revision
        run: echo "Native Mac checks for $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build, syntax checks and offline tests
        run: bash scripts/ci.sh
      - name: Build and inspect sandboxed Mac App Store target
        run: bash scripts/verify-store.sh
  ios:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact simulator verification revision
        run: echo "iOS Simulator checks for $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build iOS app and shared GlacierCore for Simulator
        run: bash scripts/verify-ios.sh
